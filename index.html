<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ангийн Хамгийн Хамгийн 🏆</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .card-icon {
            font-size: 1.8rem;
            background: #334155;
            padding: 8px 12px;
            border-radius: 12px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .vote-section {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        select {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        button.vote-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button.vote-btn:hover {
            background-color: var(--primary-hover);
        }

        .result-box {
            background-color: #0f172a;
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent);
        }

        .winner-name {
            font-weight: bold;
            color: var(--accent);
        }

        .vote-count {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            .vote-section {
                flex-direction: column;
            }
            button.vote-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🏆 Ангийн Хамгийн Хамгийн 🏆</h1>
        <p class="subtitle">Өөрийн саналыг өгч, тодорхойлоорой!</p>
    </header>

    <div class="container" id="categories-container"></div>

    <script>
        // Ангийн 44 сурагчдын жагсаалт
        const students = [
            "Nymaa", "Enhhuslen", "Orgio", "Tengis", "Hosoo", "Hoski", "Shinezul", "Suldee", 
            "Engujin", "Trko", "Monhtemuln", "Tergel", "Maral", "Bayraa", "Tsomoo", "Enhln", 
            "Enhee", "Iveelt", "Enhmaa", "Michka", "Suhee", "Tuya", "Baadai", "Amka", 
            "Erdnee", "Anudari", "Anujingoo", "N.Nandia", "T.Enhjn", "E.Enhjn", "Haliun", 
            "Naran", "Sanchir", "Tsgana", "Tseku", "Zoloo", "Anujin", "Togszaya", "B.Nandia", 
            "Urnaa", "Aniraa", "Amarhishig", "Margad", "Myngaa"
        ];

        // Номинациудын жагсаалт
        const categories = [
            { id: "sleepy", icon: "😴", title: "Хамгийн унтамхай" },
            { id: "funny", icon: "😂", title: "Хамгийн хөгжилтэй" },
            { id: "smart", icon: "🧠", title: "Хамгийн ухаантай / Онц сурлагатан" },
            { id: "stylish", icon: "✨", title: "Хамгийн загварлаг" },
            { id: "kind", icon: "❤️", title: "Хамгийн тусархаг, зөөлөн" },
            { id: "loud", icon: "🔊", title: "Хамгийн шуугиантай / Нийтэч" },
            { id: "gamer", icon: "🎮", title: "Хамгийн мундаг Gamer" }
        ];

        // LocalStorage-оос саналуудыг унших эсвэл шинээр үүсгэх
        let votesData = JSON.parse(localStorage.getItem('class_votes')) || {};

        function saveVotes() {
            localStorage.setItem('class_votes', JSON.stringify(votesData));
        }

        function initApp() {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';

            categories.forEach(cat => {
                if (!votesData[cat.id]) {
                    votesData[cat.id] = {};
                }

                // Хамгийн олон санал авсан хүнийг олох
                let topName = "Одоогоор санал ирээгүй";
                let maxVotes = 0;

                for (const name in votesData[cat.id]) {
                    if (votesData[cat.id][name] > maxVotes) {
                        maxVotes = votesData[cat.id][name];
                        topName = name;
                    }
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-icon">${cat.icon}</span>
                        <span class="card-title">${cat.title}</span>
                    </div>
                    <div class="vote-section">
                        <select id="select-${cat.id}">
                            <option value="">-- Нэр сонгох --</option>
                            ${students.map(s => `<option value="${s}">${s}</option>`).join('')}
                        </select>
                        <button class="vote-btn" onclick="submitVote('${cat.id}')">Санал өгөх</button>
                    </div>
                    <div class="result-box">
                        <span>👑 Тэргүүлэгч: <span class="winner-name">${topName}</span></span>
                        <span class="vote-count">${maxVotes > 0 ? maxVotes + ' санал' : ''}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function submitVote(categoryId) {
            const select = document.getElementById(`select-${categoryId}`);
            const selectedName = select.value;

            if (!selectedName) {
                alert("Санал өгөхийн тулд нэр сонгоно уу!");
                return;
            }

            // Санал нэмэх
            votesData[categoryId][selectedName] = (votesData[categoryId][selectedName] || 0) + 1;
            saveVotes();
            initApp();

            // Цацаг үсэргэх эффект
            confetti({
                particleCount: 80,
                spread: 60,
                origin: { y: 0.7 }
            });
        }

        initApp();
    </script>
</body>
</html>
